name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$GITHUB_REF")
          test "$(git cat-file -t "$sha")" = tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')" = true
      - run: npm ci
      - name: Verify version and extract latest release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release.mjs
          version="${TAG#v}"
          first=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md)
          [[ "$first" == "## [$version] - "* ]]
          awk -v heading="$first" '$0 == heading {active=1; next} active && /^## / {exit} active {print}' CHANGELOG.md > release-notes.txt
          test -s release-notes.txt
      - run: npm run check-package
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.txt
